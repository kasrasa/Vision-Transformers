[project]
name = "vision-transformers"
version = "0.1.0"
description = ""
authors = [
    {name = "kasra sadatsharifi"}
]
license = "MIT License"
readme = "README.md"
requires-python = ">=3.12, <=3.13"
dependencies = [
    "torch (>=2.15.0,<3.0.0)",
    "torchvision (>=0.29.2,<0.30.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
